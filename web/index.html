<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebRTC Call</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='14' height='12' x='2' y='6' rx='2'/><path d='m22 8-6 4 6 4V8Z'/></svg>" />
  <style>
    /* ============ 设计变量（与 webrtc-signaling 保持同一设计语言） ============ */
    :root {
      --font-en: "Code New Roman", "Segoe UI", Roboto, sans-serif;
      --font-cn: "Resource Han Rounded CN", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --bg: #f4f6fb;
      --card: #ffffff;
      --card-soft: #f8fafc;
      --ink: #0f172a;
      --ink-2: #475569;
      --ink-3: #94a3b8;
      --line: #e6eaf2;
      --line-2: #cbd5e1;
      --brand: #4f46e5;
      --brand-2: #7c3aed;
      --brand-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
      --brand-soft: #eef2ff;
      --ok: #10b981;
      --ok-soft: #ecfdf5;
      --ok-line: #a7f3d0;
      --warn: #f59e0b;
      --warn-soft: #fffbeb;
      --err: #ef4444;
      --err-soft: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
      --shadow-md: 0 8px 30px -12px rgba(79,70,229,.15);
      --r-lg: 22px;
      --r-md: 16px;
      --r-sm: 10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{
      font-family:var(--font-cn),var(--font-en);
      color:var(--ink);line-height:1.55;min-height:100vh;
      background:
        radial-gradient(900px 420px at 88% -8%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
        radial-gradient(800px 420px at -6% 108%, #ede9fe 0%, rgba(237,233,254,0) 55%),
        var(--bg);
      background-attachment:fixed;
    }
    .hidden{display:none!important}
    .container{max-width:1000px;margin:0 auto;padding:28px 20px 48px}

    /* ============ 顶栏 ============ */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .brand-logo{
      width:46px;height:46px;flex:none;border-radius:15px;background:var(--brand-grad);
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 10px 24px -10px rgba(79,70,229,.6);
    }
    .brand-logo svg{width:22px;height:22px}
    .brand-text{min-width:0}
    .brand h1{font-size:1.4rem;font-weight:700;letter-spacing:.01em;line-height:1.25;white-space:nowrap;color:var(--ink)}
    .brand .sub{font-size:.74rem;color:var(--ink-3);font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
    .badge{
      flex:none;font-size:.74rem;font-weight:600;letter-spacing:.05em;padding:6px 14px;
      border-radius:999px;display:inline-flex;align-items:center;gap:7px;
      background:#f1f5f9;color:var(--ink-3);border:1px solid var(--line);
    }
    .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
    .badge--online{background:var(--ok-soft);color:#047857;border-color:var(--ok-line)}
    .badge--warn{background:var(--warn-soft);color:#b45309;border-color:#fde68a}

    /* ============ 卡片（加入面板 / 通话面板） ============ */
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
      box-shadow:var(--shadow-md);
    }
    #joinPanel{max-width:460px;margin:26px auto 0;padding:30px 34px 30px;text-align:center;position:relative;overflow:hidden}
    #joinPanel::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--brand-grad)}
    .join-icon{
      width:54px;height:54px;margin:2px auto 14px;border-radius:16px;background:var(--brand-grad);
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 12px 26px -10px rgba(79,70,229,.6);
    }
    .join-icon svg{width:25px;height:25px}
    .panel-title{font-size:1.18rem;font-weight:700;margin-bottom:6px}
    .panel-desc{font-size:.84rem;color:var(--ink-3);margin-bottom:22px}
    .form-row{text-align:left;margin-bottom:16px}
    .form-row label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:7px}
    .form-row input{
      width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);
      background:var(--card-soft);color:var(--ink);font-family:var(--font-cn),var(--font-en);font-size:.94rem;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .form-row input::placeholder{color:#b7c3d6}
    .form-row input:focus{outline:none;background:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.14)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;
      border-radius:var(--r-sm);border:none;font-family:var(--font-cn),var(--font-en);
      font-size:.9rem;font-weight:600;cursor:pointer;color:var(--ink-2);background:#f1f5f9;
      transition:all .18s ease;
    }
    .btn:hover{background:#e8edf5;color:var(--ink)}
    .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .btn-primary{
      width:100%;margin-top:4px;color:#fff;background:var(--brand-grad);
      box-shadow:0 14px 28px -12px rgba(79,70,229,.65);
    }
    .btn-primary:hover{background:linear-gradient(135deg,#4338ca,#6d28d9);color:#fff}
    .btn-primary:disabled{background:#a5b4fc}
    .btn-sm{padding:8px 18px;font-size:.82rem;border-radius:9px;width:auto}

    /* ============ 通话面板 ============ */
    #callPanel{padding:24px}
    .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
    .video-card{
      position:relative;border-radius:var(--r-md);overflow:hidden;
      background:linear-gradient(135deg,#eef2ff,#faf5ff);aspect-ratio:16/9;
      border:1px solid var(--line);box-shadow:var(--shadow-sm);
    }
    .video-card video{width:100%;height:100%;object-fit:cover;display:block;background:#0f172a}
    .video-card--local{box-shadow:0 0 0 2px var(--brand), var(--shadow-md)}
    .video-label{
      position:absolute;bottom:10px;left:10px;font-size:.72rem;font-weight:700;color:#fff;
      background:rgba(15,23,42,.55);padding:3px 12px;border-radius:999px;
      display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em;
    }
    .video-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
    .media-controls{display:flex;justify-content:center;gap:16px;padding:18px 0 4px;flex-wrap:wrap}
    .btn-icon{
      width:52px;height:52px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--ink-2);
      box-shadow:var(--shadow-sm);transition:all .18s ease;
    }
    .btn-icon svg{width:22px;height:22px}
    .btn-icon:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(15,23,42,.3)}
    .btn-icon:active{transform:translateY(0)}
    .btn-icon--danger{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:none;box-shadow:0 12px 24px -10px rgba(220,38,38,.55)}
    .btn-icon--danger:hover{background:linear-gradient(135deg,#f87171,#dc2626)}
    .btn-icon--muted{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;border:none;box-shadow:0 12px 24px -10px rgba(217,119,6,.45)}
    .btn-icon--muted:hover{background:linear-gradient(135deg,#fbbf24,#d97706)}
    .btn-icon--active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.14)}

    /* ============ 聊天 ============ */
    .chat{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
    .chat-log{padding:14px 16px;min-height:108px;max-height:220px;overflow-y:auto;font-size:.88rem;line-height:1.75;color:var(--ink-2);background:var(--card)}
    .chat-log .msg-time{color:#b7c3d6;margin-right:8px;font-size:.7rem}
    .chat-log .msg-name{font-weight:700;color:var(--brand)}
    .chat-log .msg-sys{color:var(--ink-3);font-size:.8rem;font-style:italic}
    .chat-input{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--card-soft)}
    .chat-input input{
      flex:1;min-width:0;padding:9px 13px;border:1.5px solid var(--line-2);border-radius:10px;
      background:#fff;color:var(--ink);font-family:var(--font-cn),var(--font-en);font-size:.88rem;
      transition:border-color .2s, box-shadow .2s;
    }
    .chat-input input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    .chat-input input::placeholder{color:#b7c3d6}
    .chat-input .btn{border-radius:10px;margin:0;width:auto}

    /* ============ 状态条 ============ */
    .status{
      margin-top:18px;padding:11px 16px;border-radius:var(--r-sm);font-size:.84rem;font-weight:500;
      border-left:4px solid var(--line-2);background:var(--card);box-shadow:var(--shadow-sm);
      display:flex;align-items:center;gap:9px;
    }
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
    .status-info{border-left-color:var(--brand);background:var(--brand-soft)}
    .status-info::before{background:var(--brand)}
    .status-ok{border-left-color:var(--ok);background:var(--ok-soft);color:#065f46}
    .status-ok::before{background:var(--ok)}
    .status-warn{border-left-color:var(--warn);background:var(--warn-soft);color:#92400e}
    .status-warn::before{background:var(--warn)}
    .status-error{border-left-color:var(--err);background:var(--err-soft);color:#991b1b}
    .status-error::before{background:var(--err)}

    @media(max-width:600px){
      .container{padding:18px 12px 32px}
      .brand h1{font-size:1.1rem}
      .brand-logo{width:38px;height:38px}
      .video-grid{grid-template-columns:1fr}
      #joinPanel{padding:24px 20px}
      #callPanel{padding:14px}
      .btn-icon{width:46px;height:46px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="12" x="2" y="6" rx="2"/><path d="m22 8-6 4 6 4V8Z"/></svg></span>
        <div class="brand-text">
          <h1>WebRTC Call</h1>
          <div class="sub">Call Demo</div>
        </div>
      </div>
      <span class="badge" id="connBadge">离线</span>
    </header>

    <section class="panel" id="joinPanel">
      <div class="join-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="12" x="2" y="6" rx="2"/><path d="m22 8-6 4 6 4V8Z"/></svg></div>
      <div class="panel-title">加入通话</div>
      <div class="panel-desc">输入房间号与昵称，开始端到端音视频通话</div>
      <div class="form-row">
        <label for="room">房间</label>
        <input id="room" placeholder="demo" autocomplete="off" spellcheck="false" />
      </div>
      <div class="form-row">
        <label for="name">昵称</label>
        <input id="name" placeholder="Alice" autocomplete="off" spellcheck="false" />
      </div>
      <button id="start" class="btn btn-primary">加入房间</button>
    </section>

    <section class="panel hidden" id="callPanel" style="max-width:none">
      <div class="video-grid" id="videoGrid">
        <div class="video-card video-card--local">
          <video id="local" autoplay playsinline muted></video>
          <span class="video-label" id="localLabel">我</span>
        </div>
      </div>

      <div class="media-controls">
        <button id="toggleMic" class="btn-icon" title="麦克风"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
        <button id="toggleCam" class="btn-icon" title="摄像头"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg></button>
        <button id="shareScreen" class="btn-icon" title="屏幕共享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 10 3-3 3 3"/><path d="M12 13V7"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></button>
        <button id="leave" class="btn-icon btn-icon--danger" title="离开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
      </div>

      <div class="chat">
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-input" id="chatForm">
          <input id="chatText" placeholder="输入消息，Enter 发送..." autocomplete="off" />
          <button type="submit" class="btn btn-sm">发送</button>
        </form>
      </div>
    </section>

    <div class="status" id="status">就绪</div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const myId = "u-" + Math.random().toString(36).slice(2, 10);
    const iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];

    const ICON = {
      mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
      micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
      cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>',
      camOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>',
    };
    const setIcon = (el, name) => el.innerHTML = ICON[name];

    let ws = null, roomId = null, displayName = null, localStream = null;
    let screenStream = null, usingScreen = false;
    let intentionalLeave = false, reconnectAttempts = 0;
    let micEnabled = true, camEnabled = true;
    const MAX_RECONNECT = 5;
    const pcs = new Map();
    const dataChannels = new Map();
    const knownPeers = new Set();

    const els = {
      joinPanel: $("#joinPanel"), callPanel: $("#callPanel"), connBadge: $("#connBadge"),
      status: $("#status"), chatLog: $("#chatLog"), chatForm: $("#chatForm"), chatText: $("#chatText"),
      videoGrid: $("#videoGrid"), localVideo: $("#local"), localLabel: $("#localLabel"),
      startBtn: $("#start"), leaveBtn: $("#leave"),
      toggleMic: $("#toggleMic"), toggleCam: $("#toggleCam"), shareScreen: $("#shareScreen"),
    };

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }
    const shortId = id => id ? id.slice(0, 8) : "???";
    function setStatus(text, type = "info") {
      els.status.textContent = text;
      els.status.className = "status status-" + type;
    }
    function setBadge(state) {
      const b = els.connBadge;
      b.className = "badge";
      if (state === "online") { b.textContent = "在线"; b.classList.add("badge--online"); }
      else if (state === "warn") { b.textContent = "重连中"; b.classList.add("badge--warn"); }
      else { b.textContent = "离线"; }
    }
    function logChat(html) {
      const div = document.createElement("div");
      div.innerHTML = '<span class="msg-time">' + new Date().toLocaleTimeString() + "</span>" + html;
      els.chatLog.appendChild(div);
      els.chatLog.scrollTop = els.chatLog.scrollHeight;
    }
    const logSystem = t => logChat('<span class="msg-sys">' + t + "</span>");
    const logMessage = (name, text) => logChat('<span class="msg-name">' + name + ":</span> " + text.replace(/</g, "&lt;"));

    function ensureVideoCard(peerId) {
      const cid = "vc-" + peerId;
      let card = document.getElementById(cid);
      if (card) return card.querySelector("video");
      card = document.createElement("div");
      card.id = cid;
      card.className = "video-card";
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      const label = document.createElement("span");
      label.className = "video-label";
      label.textContent = shortId(peerId);
      card.appendChild(video);
      card.appendChild(label);
      els.videoGrid.appendChild(card);
      return video;
    }
    function removeVideoCard(peerId) {
      const c = document.getElementById("vc-" + peerId);
      if (c) c.remove();
    }

    function createPC(peerId) {
      const pc = new RTCPeerConnection({ iceServers });
      pcs.set(peerId, pc);
      const stream = usingScreen && screenStream ? screenStream : localStream;
      if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
      pc.ontrack = ev => { ensureVideoCard(peerId).srcObject = ev.streams[0]; };
      pc.onicecandidate = ev => {
        if (ev.candidate) send({ type: "candidate", to: peerId, candidate: ev.candidate });
      };
      pc.ondatachannel = ev => setupDataChannel(peerId, ev.channel);
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") logSystem("与 " + shortId(peerId) + " 的连接失败");
        if (pc.connectionState === "disconnected") logSystem("与 " + shortId(peerId) + " 的连接中断");
      };
      return pc;
    }

    function setupDataChannel(peerId, channel) {
      dataChannels.set(peerId, channel);
      channel.onopen = () => logSystem("聊天通道已建立: " + shortId(peerId));
      channel.onmessage = ev => logMessage(shortId(peerId), ev.data);
      channel.onclose = () => logSystem("聊天通道已关闭: " + shortId(peerId));
    }

    async function negotiate(peerId) {
      const pc = pcs.get(peerId) || createPC(peerId);
      const dc = pc.createDataChannel("chat");
      setupDataChannel(peerId, dc);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send({ type: "offer", to: peerId, sdp: offer.sdp });
    }

    function closePeer(peerId) {
      const pc = pcs.get(peerId);
      if (pc) { pc.close(); pcs.delete(peerId); }
      dataChannels.delete(peerId);
      removeVideoCard(peerId);
    }

    function cleanupAllPeers() {
      for (const pid of pcs.keys()) closePeer(pid);
      knownPeers.clear();
    }

    function handleMembers(members) {
      const current = new Set(members.filter(id => id && id !== myId));
      for (const pid of current) {
        if (!knownPeers.has(pid)) {
          knownPeers.add(pid);
          if (myId < pid) negotiate(pid);
        }
      }
      for (const pid of knownPeers) {
        if (!current.has(pid)) {
          closePeer(pid);
          knownPeers.delete(pid);
        }
      }
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(proto + "://" + location.host + "/ws");

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus("已连接，加入房间...", "info");
        send({ type: "join", room: roomId, from: myId });
      };

      ws.onmessage = async e => {
        const m = JSON.parse(e.data);
        switch (m.type) {
          case "joined":
            setBadge("online");
            setStatus("已加入房间 " + roomId, "ok");
            break;
          case "room_members":
            handleMembers(m.members || []);
            break;
          case "offer": {
            const pc = pcs.get(m.from) || createPC(m.from);
            await pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", to: m.from, sdp: answer.sdp });
            break;
          }
          case "answer": {
            const pc = pcs.get(m.from);
            if (pc) await pc.setRemoteDescription({ type: "answer", sdp: m.sdp });
            break;
          }
          case "candidate": {
            const pc = pcs.get(m.from);
            if (pc) { try { await pc.addIceCandidate(m.candidate); } catch (err) { console.warn("ICE error", err); } }
            break;
          }
          case "hangup":
            closePeer(m.from);
            knownPeers.delete(m.from);
            logSystem(shortId(m.from) + " 挂断");
            break;
          case "error":
            logSystem("错误 [" + m.code + "]: " + m.error);
            setStatus("错误: " + m.error, "error");
            break;
        }
      };

      ws.onerror = () => setStatus("连接出错", "error");
      ws.onclose = () => {
        setBadge("offline");
        if (!intentionalLeave) {
          cleanupAllPeers();
          scheduleReconnect();
        } else {
          setStatus("已断开", "info");
        }
      };
    }

    async function scheduleReconnect() {
      if (intentionalLeave || reconnectAttempts >= MAX_RECONNECT) {
        if (reconnectAttempts >= MAX_RECONNECT) setStatus("重连次数已用尽，请重新加入", "error");
        return;
      }
      reconnectAttempts++;
      const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 16000);
      setBadge("warn");
      setStatus("断线重连中... 第" + reconnectAttempts + "/" + MAX_RECONNECT + "次（" + delay / 1000 + "s）", "warn");
      await new Promise(r => setTimeout(r, delay));
      if (intentionalLeave) return;
      try { connectWS(); }
      catch (e) { logSystem("重连失败: " + e.message); scheduleReconnect(); }
    }

    function toggleMic() {
      if (!localStream) return;
      micEnabled = !micEnabled;
      localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
      setIcon(els.toggleMic, micEnabled ? "mic" : "micOff");
      els.toggleMic.classList.toggle("btn-icon--muted", !micEnabled);
    }
    function toggleCam() {
      if (!localStream) return;
      camEnabled = !camEnabled;
      localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
      setIcon(els.toggleCam, camEnabled ? "cam" : "camOff");
      els.toggleCam.classList.toggle("btn-icon--muted", !camEnabled);
    }

    async function toggleScreenShare() {
      if (usingScreen) { stopScreenShare(); return; }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        usingScreen = true;
        els.shareScreen.classList.add("btn-icon--active");
        const track = screenStream.getVideoTracks()[0];
        track.onended = stopScreenShare;
        els.localVideo.srcObject = screenStream;
        for (const pc of pcs.values()) {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
          if (sender) await sender.replaceTrack(track);
        }
        logSystem("已开启屏幕共享");
      } catch (e) {
        logSystem("屏幕共享失败: " + e.message);
      }
    }
    function stopScreenShare() {
      if (!screenStream) return;
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
      usingScreen = false;
      els.shareScreen.classList.remove("btn-icon--active");
      if (localStream) els.localVideo.srcObject = localStream;
      for (const pc of pcs.values()) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (sender && localStream) {
          const camTrack = localStream.getVideoTracks()[0];
          if (camTrack) sender.replaceTrack(camTrack);
        }
      }
      logSystem("已停止屏幕共享");
    }

    async function start() {
      roomId = $("#room").value.trim() || "demo";
      displayName = $("#name").value.trim() || "Guest";
      intentionalLeave = false;
      reconnectAttempts = 0;
      micEnabled = true;
      camEnabled = true;
      setIcon(els.toggleMic, "mic");
      setIcon(els.toggleCam, "cam");
      els.toggleMic.classList.remove("btn-icon--muted");
      els.toggleCam.classList.remove("btn-icon--muted");
      els.startBtn.disabled = true;
      setStatus("获取媒体设备...", "info");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        els.localVideo.srcObject = localStream;
      } catch {
        logSystem("摄像头/麦克风获取失败，将以纯信令模式运行");
      }
      els.localLabel.textContent = displayName;
      setStatus("连接服务器...", "info");
      connectWS();
      els.joinPanel.classList.add("hidden");
      els.callPanel.classList.remove("hidden");
    }

    function leave() {
      intentionalLeave = true;
      if (ws && ws.readyState === WebSocket.OPEN) { send({ type: "leave" }); ws.close(); }
      if (usingScreen) stopScreenShare();
      cleanupAllPeers();
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      els.localVideo.srcObject = null;
      els.chatLog.innerHTML = "";
      setBadge("offline");
      els.callPanel.classList.add("hidden");
      els.joinPanel.classList.remove("hidden");
      els.startBtn.disabled = false;
      setStatus("已离开房间", "info");
    }

    function sendChat() {
      const text = els.chatText.value.trim();
      if (!text) return;
      let sent = false;
      for (const dc of dataChannels.values()) {
        if (dc.readyState === "open") { dc.send(text); sent = true; }
      }
      if (sent) logMessage("我", text);
      else logSystem("聊天通道未建立，请等待连接完成");
      els.chatText.value = "";
    }

    els.startBtn.addEventListener("click", () =>
      start().catch(e => { setStatus(e.message, "error"); els.startBtn.disabled = false; })
    );
    els.leaveBtn.addEventListener("click", leave);
    els.toggleMic.addEventListener("click", toggleMic);
    els.toggleCam.addEventListener("click", toggleCam);
    els.shareScreen.addEventListener("click", toggleScreenShare);
    els.chatForm.addEventListener("submit", e => { e.preventDefault(); sendChat(); });
    window.addEventListener("beforeunload", leave);
  </script>
</body>
</html>
