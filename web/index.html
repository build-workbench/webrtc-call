<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebRTC Call — 极简原生 P2P 音视频通话</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>" />
  <style>
    :root {
      --bg-base: #060911;
      --bg-surface: rgba(13, 20, 36, 0.72);
      --bg-surface-elevated: rgba(20, 30, 52, 0.85);
      --bg-card: #090e1a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(99, 102, 241, 0.6);
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
      --brand-gradient: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      --accent-glow: rgba(99, 102, 241, 0.3);
      --accent-cyan: #38bdf8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-glow: rgba(239, 68, 68, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --warning: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
      --shadow-card: 0 12px 30px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
      --shadow-dock: 0 16px 36px -6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 0 1px var(--border-subtle);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(236, 72, 153, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* ── App Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      background: rgba(6, 9, 17, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      transition: all 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 0 20px var(--accent-glow);
      position: relative;
    }

    .brand-icon-wrap::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: var(--primary-gradient);
      opacity: 0.3;
      filter: blur(4px);
      z-index: -1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-tagline {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      transition: all 0.2s ease;
    }

    .room-pill {
      cursor: pointer;
      user-select: none;
    }
    .room-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-medium);
      color: var(--text-main);
    }
    .room-pill:active { transform: scale(0.97); }
    .room-pill .pill-val {
      font-weight: 600;
      color: #93c5fd;
    }

    .timer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success-glow);
      animation: pulse-glow 1.8s infinite ease-in-out;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .badge--online {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }
    .badge--warn {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
    }

    /* ── Main Layout ── */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Lobby (Join Card) ── */
    .lobby-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .join-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      animation: float-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .join-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
    }

    .join-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .join-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .join-title {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .join-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .label-hint {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      font-size: 0.95rem;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(6, 9, 17, 0.7);
      color: var(--text-main);
      font-size: 0.94rem;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-wrap input:hover {
      border-color: var(--border-medium);
      background: rgba(6, 9, 17, 0.85);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: #6366f1;
      background: rgba(6, 9, 17, 0.95);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-dice {
      position: absolute;
      right: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-dice:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      transform: rotate(30deg);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 24px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 0.94rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      width: 100%;
      margin-top: 10px;
      background: var(--primary-gradient);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .btn-primary:hover {
      opacity: 0.96;
      transform: translateY(-1px);
      box-shadow: 0 8px 26px var(--accent-glow);
    }
    .btn-primary:active { transform: translateY(0); }

    .feature-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--border-subtle);
    }
    .feature-tag {
      font-size: 0.74rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }
    .feature-tag svg {
      color: #818cf8;
    }

    /* ── Active Call Stage ── */
    .call-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
      animation: float-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .stage-layout {
      flex: 1;
      display: flex;
      gap: 16px;
      min-height: 520px;
      position: relative;
    }

    /* ── Video Grid ── */
    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 18px;
      align-content: center;
      justify-content: center;
      background: rgba(6, 9, 17, 0.4);
      border-radius: var(--radius-xl);
      padding: 20px;
      border: 1px solid var(--border-subtle);
      transition: all 0.3s ease;
    }

    .video-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow-card);
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .video-card--local {
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* Active voice glow */
    .video-card.speaking {
      border-color: var(--accent-cyan) !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.5), 0 0 28px rgba(56, 189, 248, 0.4) !important;
    }

    /* Spotlight / Maximized mode */
    .video-card.spotlight {
      grid-column: 1 / -1;
      aspect-ratio: 21/9;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.5), 0 0 32px rgba(139, 92, 246, 0.3);
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .video-card--local video:not(.screenshare) {
      transform: scaleX(-1);
    }

    /* Video Overlay & Controls */
    .video-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.65) 100%);
      opacity: 0.9;
      transition: opacity 0.25s ease;
    }

    .video-card:hover .video-overlay {
      opacity: 1;
    }

    .video-overlay > * { pointer-events: auto; }

    .video-top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .card-action-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: rgba(6, 9, 17, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-action-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
      transform: scale(1.05);
    }

    .video-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-pill {
      font-size: 0.78rem;
      font-weight: 500;
      background: rgba(6, 9, 17, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .user-pill .tag-self {
      font-size: 0.68rem;
      background: var(--primary);
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .sound-bars {
      display: none;
      align-items: center;
      gap: 2px;
      height: 12px;
    }
    .video-card.speaking .sound-bars {
      display: inline-flex;
    }
    .sound-bar {
      width: 2px;
      background: var(--accent-cyan);
      border-radius: 1px;
      animation: sound-bounce 0.8s infinite ease-in-out alternate;
    }
    .sound-bar:nth-child(2) { animation-delay: 0.2s; }
    .sound-bar:nth-child(3) { animation-delay: 0.4s; }

    /* Avatar Fallback Placeholder */
    .avatar-fallback {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #151d30 0%, #080c16 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 2;
    }
    .avatar-fallback.active { display: flex; }

    .avatar-circle {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px var(--accent-glow);
      position: relative;
    }

    .avatar-circle::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      animation: rotate-slow 20s linear infinite;
    }

    .avatar-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* ── Chat Drawer ── */
    .chat-drawer {
      width: 360px;
      background: var(--bg-surface);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .chat-title {
      font-size: 0.96rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text-main);
    }

    .chat-log {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.86rem;
      min-height: 220px;
      scroll-behavior: smooth;
    }

    .chat-empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-dim);
      padding: 24px;
    }
    .chat-empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.6;
    }
    .chat-empty-state p {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .chat-empty-state span {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      word-break: break-word;
      animation: fade-in 0.2s ease-out;
    }

    .chat-msg--self {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-msg--peer {
      align-self: flex-start;
      align-items: flex-start;
    }

    .chat-msg-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      padding: 0 6px;
      font-weight: 500;
    }

    .chat-msg-bubble {
      padding: 9px 15px;
      border-radius: var(--radius-md);
      line-height: 1.5;
      font-size: 0.88rem;
    }

    .chat-msg--self .chat-msg-bubble {
      background: var(--primary-gradient);
      color: #fff;
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    .chat-msg--peer .chat-msg-bubble {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 3px;
    }

    .chat-msg--sys {
      align-self: center;
      text-align: center;
      font-size: 0.73rem;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 12px;
      border-radius: 999px;
      margin: 4px 0;
    }

    .chat-input-wrap {
      display: flex;
      padding: 14px;
      gap: 10px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(6, 9, 17, 0.4);
    }

    .chat-input-wrap input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(6, 9, 17, 0.7);
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .chat-input-wrap input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--primary-gradient);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .chat-send-btn:hover {
      opacity: 0.95;
      transform: scale(1.05);
    }
    .chat-send-btn:active { transform: scale(0.95); }

    /* ── Floating Media Control Dock ── */

    .btn-dock[data-tooltip]::before {

    /* ── Bottom Status Bar ── */
    .status-bar {
      margin-top: 14px;

    .status-info { color: #60a5fa; }

    .status-error { color: #f87171; }

    /* ── Toast Notifications ── */
    .toast-container {
      position: fixed;
      top: 76px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;

    .toast {
      padding: 12px 18px;

    }
    .toast--leaving {

    }

    /* ── Keyframe Animations ── */
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }

  <script>
    const $ = s => document.querySelector(s);
    const myId = "u-" + Math.random().toString(36).slice(2, 10);
    const iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];

    let ws = null, roomId = null, displayName = null, localStream = null;
    let screenStream = null, usingScreen = false;
    let intentionalLeave = false, reconnectAttempts = 0;
    let micEnabled = true, camEnabled = true;
    let callTimerInterval = null, callStartTime = null;
    let chatOpen = false, unreadCount = 0;
    let audioMeterStop = null;
    const MAX_RECONNECT = 5;
    const pcs = new Map();
    const dataChannels = new Map();
    const knownPeers = new Set();

    const els = {
      joinPanel: $("#joinPanel"), callPanel: $("#callPanel"), connBadge: $("#connBadge"),
      status: $("#status"), chatLog: $("#chatLog"), chatForm: $("#chatForm"), chatText: $("#chatText"),
      chatEmpty: $("#chatEmpty"), videoGrid: $("#videoGrid"), localVideo: $("#local"), localLabel: $("#localLabel"),
      localCard: $("#localCard"), localAvatar: $("#localAvatar"), localAvatarCircle: $("#localAvatarCircle"),
      localAvatarName: $("#localAvatarName"), startBtn: $("#start"), leaveBtn: $("#leave"),
      toggleMic: $("#toggleMic"), toggleCam: $("#toggleCam"), shareScreen: $("#shareScreen"),
      toggleChat: $("#toggleChat"), chatDrawer: $("#chatDrawer"), closeChatBtn: $("#closeChatBtn"),
      unreadBadge: $("#unreadBadge"), headerCallInfo: $("#headerCallInfo"), roomPill: $("#roomPill"),
      roomPillVal: $("#roomPillVal"), copyTip: $("#copyTip"), callTimer: $("#callTimer"),
      memberCount: $("#memberCount"), btnRandomRoom: $("#btnRandomRoom"), roomInput: $("#room"),
      nameInput: $("#name")
    };

    // Color gradients palette for participant avatars
    const AVATAR_GRADIENTS = [
      "linear-gradient(135deg, #3b82f6, #8b5cf6)",
      "linear-gradient(135deg, #ec4899, #8b5cf6)",
      "linear-gradient(135deg, #10b981, #06b6d4)",
      "linear-gradient(135deg, #f59e0b, #ef4444)",
      "linear-gradient(135deg, #8b5cf6, #3b82f6)",
      "linear-gradient(135deg, #14b8a6, #3b82f6)"
    ];
    function getAvatarGradient(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
    }

    // Auto-fill room from URL query if present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("room")) {
      els.roomInput.value = urlParams.get("room");
    }

    // Random room name generator
    els.btnRandomRoom.addEventListener("click", () => {
      const words = ["alpha", "beta", "gamma", "lounge", "dev", "matrix", "nexus", "studio", "cafe"];
      const randWord = words[Math.floor(Math.random() * words.length)];
      const randNum = Math.floor(100 + Math.random() * 900);
      els.roomInput.value = `${randWord}-${randNum}`;
      els.roomInput.focus();
    });

    // Subtle synthesizer audio chime (zero audio files needed)
    function playChime(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === "join") {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === "msg") {
          osc.frequency.setValueAtTime(587, now);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === "leave") {
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.2);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch {}
    }

    // Audio meter for voice activity detection
    function attachAudioMeter(stream, targetCard) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx || !stream.getAudioTracks().length) return () => {};
        const ctx = new AudioCtx();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        let raf;
        function check() {
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          if (avg > 14) {
            targetCard.classList.add("speaking");
          } else {
            targetCard.classList.remove("speaking");
          }
          raf = requestAnimationFrame(check);
        }
        check();
        return () => {
          cancelAnimationFrame(raf);
          targetCard.classList.remove("speaking");
          ctx.close();
        };
      } catch {
        return () => {};
      }
    }

    // SVG icon templates
    const ICONS = {
      micOn: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
      micOff: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
      camOn: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>',
      camOff: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="2" x2="22" y2="22"/><path d="m22 8-6 4 6 4V8Z"/><path d="M14 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="M10 6h4a2 2 0 0 1 2 2v4"/></svg>'
    };

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    }
    const shortId = id => id ? id.slice(0, 8) : "???";

    function showToast(msg, type = "info") {
      const container = $("#toastContainer");
      if (!container) return;
      const t = document.createElement("div");
      t.className = "toast";
      t.innerHTML = `<span>${msg}</span>`;
      container.appendChild(t);
      setTimeout(() => {
        t.classList.add("toast--leaving");
        setTimeout(() => t.remove(), 300);
      }, 3000);
    }

    function setStatus(text, type = "info") {
      els.status.textContent = text;
      els.status.className = "status-bar status-" + type;
    }

    function setBadge(state) {
      const b = els.connBadge;
      b.className = "badge";
      if (state === "online") {
        b.innerHTML = '<span class="timer-dot"></span>在线';
        b.classList.add("badge--online");
      } else if (state === "warn") {
        b.textContent = "重连中";
        b.classList.add("badge--warn");
      } else {
        b.textContent = "离线";
      }
    }

    function updateMemberCount() {
      const count = pcs.size + 1;
      els.memberCount.textContent = `${count} 人在线`;
    }

    function startTimer() {
      callStartTime = Date.now();
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const s = String(elapsed % 60).padStart(2, "0");
        els.callTimer.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(callTimerInterval);
      els.callTimer.textContent = "00:00";
    }

    function logChat(html) {
      if (els.chatEmpty) els.chatEmpty.classList.add("hidden");
      const div = document.createElement("div");
      div.innerHTML = html;
      els.chatLog.appendChild(div);
      els.chatLog.scrollTop = els.chatLog.scrollHeight;
    }

    function logSystem(t) {
      logChat(`<div class="chat-msg--sys">${t}</div>`);
    }

    function logMessage(name, text) {
      const isSelf = name === "我" || name === displayName;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      const html = `
        <div class="chat-msg ${isSelf ? 'chat-msg--self' : 'chat-msg--peer'}">
          <div class="chat-msg-meta">${name} · ${time}</div>
          <div class="chat-msg-bubble">${safeText}</div>
        </div>
      `;
      logChat(html);
      playChime("msg");

      if (!chatOpen && !isSelf) {
        unreadCount++;
        els.unreadBadge.textContent = unreadCount;
        els.unreadBadge.classList.remove("hidden");
        showToast(`💬 ${name}: ${safeText.slice(0, 24)}`);
      }
    }

    window.toggleCardFullscreen = function(cardId) {
      const card = document.getElementById(cardId);
      if (!card) return;
      if (!document.fullscreenElement) {
        card.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    window.toggleCardPiP = async function(cardId) {
      const card = document.getElementById(cardId);
      const video = card ? card.querySelector("video") : null;
      if (!video) return;
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (e) {
        showToast("浏览器不支持画中画或已被禁用", "warn");
      }
    };

    window.toggleCardSpotlight = function(cardId) {
      const card = document.getElementById(cardId);
      if (!card) return;
      card.classList.toggle("spotlight");
    };

    function ensureVideoCard(peerId) {
      const cid = "vc-" + peerId;
      let card = document.getElementById(cid);
      if (card) return card.querySelector("video");

      card = document.createElement("div");
      card.id = cid;
      card.className = "video-card";

      const initial = shortId(peerId).slice(0, 2).toUpperCase();
      const gradient = getAvatarGradient(peerId);

      card.innerHTML = `
        <div class="avatar-fallback" id="avatar-${peerId}">
          <div class="avatar-circle" style="background:${gradient}">${initial}</div>
          <span class="avatar-name">${shortId(peerId)}</span>
        </div>
        <video autoplay playsinline></video>
        <div class="video-overlay">
          <div class="video-top-bar">
            <button class="card-action-btn" title="画中画 (PiP)" onclick="toggleCardPiP('${cid}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><rect width="8" height="6" x="12" y="9" rx="1"/></svg>
            </button>
            <button class="card-action-btn" title="聚光灯聚焦" onclick="toggleCardSpotlight('${cid}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
            </button>
            <button class="card-action-btn" title="全屏" onclick="toggleCardFullscreen('${cid}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </button>
          </div>
          <div class="video-bottom-bar">
            <div class="user-pill">
              <span>${shortId(peerId)}</span>
              <div class="sound-bars">
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
              </div>
            </div>
          </div>
        </div>
      `;
      els.videoGrid.appendChild(card);
      updateMemberCount();
      return card.querySelector("video");
    }

    function removeVideoCard(peerId) {
      const c = document.getElementById("vc-" + peerId);
      if (c) c.remove();
      updateMemberCount();
    }

    function createPC(peerId) {
      const pc = new RTCPeerConnection({ iceServers });
      pcs.set(peerId, pc);
      const stream = usingScreen && screenStream ? screenStream : localStream;
      if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));

      pc.ontrack = ev => {
        const v = ensureVideoCard(peerId);
        v.srcObject = ev.streams[0];
        const card = document.getElementById("vc-" + peerId);
        if (card && ev.streams[0]) {
          attachAudioMeter(ev.streams[0], card);
        }
      };

      pc.onicecandidate = ev => {
        if (ev.candidate) send({ type: "candidate", to: peerId, candidate: ev.candidate });
      };

      pc.ondatachannel = ev => setupDataChannel(peerId, ev.channel);

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") {
          showToast(`已建立与 ${shortId(peerId)} 的 P2P 直连`, "success");
          playChime("join");
        } else if (pc.connectionState === "failed") {
          logSystem("与 " + shortId(peerId) + " 连接失败");
        } else if (pc.connectionState === "disconnected") {
          logSystem("与 " + shortId(peerId) + " 连接中断");
        }
      };

      return pc;
    }

    function setupDataChannel(peerId, channel) {
      dataChannels.set(peerId, channel);
      channel.onopen = () => logSystem("聊天通道已就绪: " + shortId(peerId));
      channel.onmessage = ev => logMessage(shortId(peerId), ev.data);
      channel.onclose = () => logSystem("聊天通道已关闭: " + shortId(peerId));
    }

    async function negotiate(peerId) {
      const pc = pcs.get(peerId) || createPC(peerId);
      const dc = pc.createDataChannel("chat");
      setupDataChannel(peerId, dc);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send({ type: "offer", to: peerId, sdp: offer.sdp });
    }

    function closePeer(peerId) {
      const pc = pcs.get(peerId);
      if (pc) { pc.close(); pcs.delete(peerId); }
      dataChannels.delete(peerId);
      removeVideoCard(peerId);
    }

    function cleanupAllPeers() {
      for (const pid of pcs.keys()) closePeer(pid);
      knownPeers.clear();
      updateMemberCount();
    }

    function handleMembers(members) {
      const current = new Set(members.filter(id => id && id !== myId));
      for (const pid of current) {
        if (!knownPeers.has(pid)) {
          knownPeers.add(pid);
          if (myId < pid) negotiate(pid);
        }
      }
      for (const pid of knownPeers) {
        if (!current.has(pid)) {
          closePeer(pid);
          knownPeers.delete(pid);
          playChime("leave");
        }
      }
      updateMemberCount();
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(proto + "://" + location.host + "/ws");

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus("已连接信令服务，正在进入房间...", "info");
        send({ type: "join", room: roomId, from: myId });
      };

      ws.onmessage = async e => {
        const m = JSON.parse(e.data);
        switch (m.type) {
          case "joined":
            setBadge("online");
            setStatus("已进入房间: #" + roomId, "ok");
            showToast(`成功加入房间 #${roomId}`);
            break;
          case "room_members":
            handleMembers(m.members || []);
            break;
          case "offer": {
            const pc = pcs.get(m.from) || createPC(m.from);
            await pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", to: m.from, sdp: answer.sdp });
            break;
          }
          case "answer": {
            const pc = pcs.get(m.from);
            if (pc) await pc.setRemoteDescription({ type: "answer", sdp: m.sdp });
            break;
          }
          case "candidate": {
            const pc = pcs.get(m.from);
            if (pc) { try { await pc.addIceCandidate(m.candidate); } catch (err) { console.warn("ICE error", err); } }
            break;
          }
          case "hangup":
            closePeer(m.from);
            knownPeers.delete(m.from);
            logSystem(shortId(m.from) + " 离开通话");
            playChime("leave");
            break;
          case "error":
            logSystem("错误 [" + m.code + "]: " + m.error);
            setStatus("错误: " + m.error, "error");
            showToast("信令错误: " + m.error, "error");
            break;
        }
      };

      ws.onerror = () => setStatus("信令网络连接异常", "error");
      ws.onclose = () => {
        setBadge("offline");
        if (!intentionalLeave) {
          cleanupAllPeers();
          scheduleReconnect();
        } else {
          setStatus("已安全离开房间", "info");
        }
      };
    }

    async function scheduleReconnect() {
      if (intentionalLeave || reconnectAttempts >= MAX_RECONNECT) {
        if (reconnectAttempts >= MAX_RECONNECT) setStatus("重连次数已用尽，请重新加入", "error");
        return;
      }
      reconnectAttempts++;
      const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 16000);
      setBadge("warn");
      setStatus(`网络中断，重连中... (${reconnectAttempts}/${MAX_RECONNECT}) ${delay / 1000}s 后重试`, "warn");
      await new Promise(r => setTimeout(r, delay));
      if (intentionalLeave) return;
      try { connectWS(); }
      catch (e) { logSystem("重连尝试失败: " + e.message); scheduleReconnect(); }
    }

    function toggleMic() {
      if (!localStream) return;
      micEnabled = !micEnabled;
      localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
      els.toggleMic.innerHTML = micEnabled ? ICONS.micOn : ICONS.micOff;
      els.toggleMic.classList.toggle("btn-dock--muted", !micEnabled);
      showToast(micEnabled ? "麦克风已开启" : "麦克风已静音");
    }

    function toggleCam() {
      if (!localStream) return;
      camEnabled = !camEnabled;
      localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
      els.toggleCam.innerHTML = camEnabled ? ICONS.camOn : ICONS.camOff;
      els.toggleCam.classList.toggle("btn-dock--muted", !camEnabled);
      els.localAvatar.classList.toggle("active", !camEnabled);
      showToast(camEnabled ? "摄像头画面已恢复" : "摄像头画面已关闭");
    }

    async function toggleScreenShare() {
      if (usingScreen) { stopScreenShare(); return; }
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        usingScreen = true;
        els.shareScreen.classList.add("btn-dock--active");
        els.localVideo.classList.add("screenshare");
        const track = screenStream.getVideoTracks()[0];
        track.onended = stopScreenShare;
        els.localVideo.srcObject = screenStream;
        for (const pc of pcs.values()) {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
          if (sender) await sender.replaceTrack(track);
        }
        showToast("屏幕共享已开启");
        logSystem("您开启了屏幕共享");
      } catch (e) {
        showToast("屏幕共享启动取消/失败", "warn");
      }
    }

    function stopScreenShare() {
      if (!screenStream) return;
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
      usingScreen = false;
      els.shareScreen.classList.remove("btn-dock--active");
      els.localVideo.classList.remove("screenshare");
      if (localStream) els.localVideo.srcObject = localStream;
      for (const pc of pcs.values()) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (sender && localStream) {
          const camTrack = localStream.getVideoTracks()[0];
          if (camTrack) sender.replaceTrack(camTrack);
        }
      }
      showToast("已停止屏幕共享");
      logSystem("您停止了屏幕共享");
    }

    function toggleChatDrawer() {
      chatOpen = !chatOpen;
      els.chatDrawer.classList.toggle("hidden", !chatOpen);
      els.toggleChat.classList.toggle("btn-dock--active", chatOpen);
      if (chatOpen) {
        unreadCount = 0;
        els.unreadBadge.textContent = "0";
        els.unreadBadge.classList.add("hidden");
        setTimeout(() => els.chatText.focus(), 150);
      }
    }

    function copyInviteLink() {
      const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomId)}`;
      navigator.clipboard.writeText(url).then(() => {
        els.copyTip.style.display = "inline";
        showToast("房间邀请链接已复制到剪贴板！");
        setTimeout(() => { els.copyTip.style.display = "none"; }, 2500);
      }).catch(() => {
        showToast(`房间链接: ${url}`);
      });
    }

    async function start() {
      roomId = els.roomInput.value.trim() || "demo";
      displayName = els.nameInput.value.trim() || "Guest";
      intentionalLeave = false;
      reconnectAttempts = 0;
      micEnabled = true;
      camEnabled = true;

      els.toggleMic.innerHTML = ICONS.micOn;
      els.toggleCam.innerHTML = ICONS.camOn;
      els.toggleMic.classList.remove("btn-dock--muted");
      els.toggleCam.classList.remove("btn-dock--muted");
      els.localAvatar.classList.remove("active");
      els.startBtn.disabled = true;

      setStatus("正在获取音视频设备权限...", "info");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        els.localVideo.srcObject = localStream;
        if (audioMeterStop) audioMeterStop();
        audioMeterStop = attachAudioMeter(localStream, els.localCard);
      } catch {
        showToast("未检测到摄像头/麦克风，以纯信令模式加入", "warn");
        logSystem("音视频设备未就绪，已切换为纯文本模式");
        els.localAvatar.classList.add("active");
      }

      els.localLabel.textContent = displayName;
      els.localAvatarName.textContent = displayName;
      els.localAvatarCircle.textContent = displayName.slice(0, 2).toUpperCase();
      els.localAvatarCircle.style.background = getAvatarGradient(displayName);

      els.roomPillVal.textContent = roomId;
      els.headerCallInfo.classList.remove("hidden");
      updateMemberCount();
      startTimer();

      setStatus("正在连接信令服务器...", "info");
      connectWS();

      els.joinPanel.classList.add("hidden");
      els.callPanel.classList.remove("hidden");
    }

    function leave() {
      intentionalLeave = true;
      if (ws && ws.readyState === WebSocket.OPEN) {
        send({ type: "leave" });
        ws.close();
      }
      if (usingScreen) stopScreenShare();
      cleanupAllPeers();
      if (audioMeterStop) { audioMeterStop(); audioMeterStop = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      els.localVideo.srcObject = null;
      els.chatLog.innerHTML = "";
      if (els.chatEmpty) els.chatEmpty.classList.remove("hidden");
      stopTimer();
      setBadge("offline");

      els.headerCallInfo.classList.add("hidden");
      els.callPanel.classList.add("hidden");
      els.joinPanel.classList.remove("hidden");
      els.startBtn.disabled = false;
      setStatus("已离开房间", "info");
      showToast("通话已结束");
    }

    function sendChat() {
      const text = els.chatText.value.trim();
      if (!text) return;
      let sent = false;
      for (const dc of dataChannels.values()) {
        if (dc.readyState === "open") {
          dc.send(text);
          sent = true;
        }
      }
      if (sent) {
        logMessage("我", text);
      } else {
        logMessage("我", text);
        logSystem("提示: 当前尚无其他对端连接建立，消息仅本地回显");
      }
      els.chatText.value = "";
    }

    // Event listeners
    els.startBtn.addEventListener("click", () => {
      start().catch(e => {
        setStatus("加入房间失败: " + e.message, "error");
        els.startBtn.disabled = false;
      });
    });
    els.leaveBtn.addEventListener("click", leave);
    els.toggleMic.addEventListener("click", toggleMic);
    els.toggleCam.addEventListener("click", toggleCam);
    els.shareScreen.addEventListener("click", toggleScreenShare);
    els.toggleChat.addEventListener("click", toggleChatDrawer);
    els.closeChatBtn.addEventListener("click", toggleChatDrawer);
    els.roomPill.addEventListener("click", copyInviteLink);
    els.chatForm.addEventListener("submit", e => {
      e.preventDefault();
      sendChat();
    });

    // Keyboard shortcuts during call
    window.addEventListener("keydown", e => {
      if (els.callPanel.classList.contains("hidden")) return;
      if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) return;
      
      const k = e.key.toLowerCase();
      if (k === "m") { e.preventDefault(); toggleMic(); }
      else if (k === "v") { e.preventDefault(); toggleCam(); }
      else if (k === "s") { e.preventDefault(); toggleScreenShare(); }
      else if (k === "c") { e.preventDefault(); toggleChatDrawer(); }
    });

    window.addEventListener("beforeunload", leave);
  </script>
</body>
</html>
